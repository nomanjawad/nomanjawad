<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Noman Jawad, freelance Next.js and full-stack developer">
  <defs>
    <radialGradient id="a1" cx="50%" cy="80%" r="48%"><stop offset="0" stop-color="#B600A8" stop-opacity="0.55"/><stop offset="1" stop-color="#B600A8" stop-opacity="0"/></radialGradient>
    <radialGradient id="a2" cx="20%" cy="28%" r="40%"><stop offset="0" stop-color="#7621B0" stop-opacity="0.45"/><stop offset="1" stop-color="#7621B0" stop-opacity="0"/></radialGradient>
    <radialGradient id="a3" cx="84%" cy="22%" r="36%"><stop offset="0" stop-color="#BE4C00" stop-opacity="0.38"/><stop offset="1" stop-color="#BE4C00" stop-opacity="0"/></radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9B6C2"/><stop offset="1" stop-color="#E6EEF3"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7621B0"/><stop offset="0.5" stop-color="#B600A8"/><stop offset="1" stop-color="#BE4C00"/></linearGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#FFE9FC"/><stop offset="0.11" stop-color="#F06AE0"/><stop offset="0.30" stop-color="#B600A8"/><stop offset="0.52" stop-color="#7621B0"/><stop offset="0.76" stop-color="#2A0B45"/><stop offset="1" stop-color="#0D0414"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#B600A8" stop-opacity="0.6"/><stop offset="0.45" stop-color="#7621B0" stop-opacity="0.3"/><stop offset="1" stop-color="#7621B0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#D7E2EA" stroke-opacity="0.07"/></pattern>
    <radialGradient id="gridmask" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="gm"><rect width="1200" height="420" fill="url(#gridmask)"/></mask>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Kanit, Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      @keyframes breathe { from { transform: scale(0.94); opacity: 0.7; } to { transform: scale(1.06); opacity: 1; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      .glow { transform-origin: 1010px 300px; animation: breathe 6s ease-in-out infinite alternate; }
      .ring { transform-origin: 1010px 300px; animation: spin 14s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .glow, .ring { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#0B0B0B"/>
  <rect width="1200" height="420" rx="24" fill="url(#a2)"/>
  <rect width="1200" height="420" rx="24" fill="url(#a3)"/>
  <rect width="1200" height="420" rx="24" fill="url(#a1)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)" mask="url(#gm)"/>

  <text class="mono" x="72" y="112" font-size="13" letter-spacing="4.2" fill="#8F9BA6">NEXT.JS · REACT · LARAVEL · WORDPRESS</text>
  <text class="sans" x="68" y="262" font-size="150" font-weight="900" letter-spacing="-3" fill="url(#txt)" textLength="760" lengthAdjust="spacingAndGlyphs">NOMAN</text>
  <text class="sans" x="68" y="338" font-size="54" font-weight="500" letter-spacing="2" fill="#D7E2EA" fill-opacity="0.92">JAWAD</text>
  <text class="mono" x="72" y="376" font-size="12" letter-spacing="2.6" fill="#8F9BA6">FREELANCE FULL-STACK DEVELOPER · DHAKA · REMOTE WORLDWIDE</text>

  <g>
    <circle class="glow" cx="1010" cy="300" r="150" fill="url(#glow)"/>
    <circle cx="1010" cy="300" r="88" fill="url(#orb)"/>
    <circle cx="1010" cy="300" r="88" fill="none" stroke="#fff" stroke-opacity="0.08"/>
    <g class="ring"><ellipse cx="1010" cy="300" rx="118" ry="34" fill="none" stroke="#D7E2EA" stroke-opacity="0.7" stroke-width="1.6" transform="rotate(-18 1010 300)" stroke-dasharray="190 120"/></g>
    <ellipse cx="1010" cy="300" rx="132" ry="46" fill="none" stroke="#D7E2EA" stroke-opacity="0.3" stroke-width="1.2" transform="rotate(14 1010 300)" stroke-dasharray="110 220"/>
  </g>

  <g class="mono" font-size="11" letter-spacing="2" fill="#D7E2EA">
    <rect x="852" y="76" width="140" height="30" rx="15" fill="#0C0C0C" fill-opacity="0.6" stroke="#D7E2EA" stroke-opacity="0.22"/>
    <circle cx="872" cy="91" r="3.5" fill="#6FCF6B"/>
    <text x="884" y="95" fill="#8F9BA6">AVAILABLE NOW</text>
  </g>
</svg>
